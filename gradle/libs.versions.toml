[versions]
agp = "8.7.2"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.8.0"
kotlin = "2.0.21"
composeBom = "2024.09.00"
room = "2.7.0-alpha11"
lifecycleViewmodelCompose = "2.8.6"
ksp = "2.0.21-1.0.28"
work = "2.9.1"
hilt = "2.52"
firebaseBom = "33.5.1"
credentialManager = "1.2.2"
googleServices = "4.4.2"
